name: ci
on:
  push:
  pull_request:

jobs:
  test:
    name: 'Unit- & API tests'
    # because of https://github.com/usebruno/bruno/issues/5003, we currently need Node.js v20, so pinning runner image at ubuntu 24.04 for now
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ^1.26
      id: go

    - name: Get dependencies
      run: go get

    - name: Unit Tests
      run: CGO_ENABLED=0 go test `go list ./... | grep -v 'github.com/muety/wakapi/scripts'` -run ./...  # skip scripts package, because not actually a package

    - name: API Tests
      # bruno pinned to version 2.15.0 because of https://github.com/usebruno/bruno/issues/6837
      run: |
        npm install -g @usebruno/cli@2.15.0
        ./testing/run_api_tests.sh

    - name: Mail Tests
      run: ./testing/run_mail_tests.sh

  frontend:
    name: 'Frontend build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm --prefix frontend ci

    - name: Type check
      run: npm --prefix frontend run typecheck

    - name: Build
      run: npm --prefix frontend run build

    - name: Ensure committed bundle is up to date
      run: |
        if ! git diff --exit-code -- static/assets/app; then
          echo "::error::static/assets/app is out of date. Run 'npm run build:app' and commit the result."
          exit 1
        fi

  migration:
    name: Migration tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql, mariadb]

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ^1.26
      id: go

    - run: npm install -g @usebruno/cli@2.15.0

    - run: ./testing/run_api_tests.sh ${{ matrix.db }} --migration
